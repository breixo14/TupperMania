<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Administración de Solicitudes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>💬 Gestión de Solicitudes Chatbot</h2>
    </div>

    <div class="card shadow">
        <div class="card-body p-0">
            <table class="table table-hover table-striped mb-0">
                <thead class="table-dark">
                <tr>
                    <th>Fecha</th>
                    <th>Usuario Chat</th>
                    <th>Mensaje Original</th>
                    <th>Intención / IA</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(solicitudes)}">
                    <td colspan="6" class="text-center py-4 text-muted">No hay solicitudes registradas desde el chatbot en este momento.</td>
                </tr>
                <tr th:each="sol : ${solicitudes}">
                    <td th:text="${#temporals.format(sol.fechaCreacion, 'dd/MM/yyyy HH:mm')}">Fecha</td>
                    <td>
                        <strong th:text="${sol.nombreCliente}">Nombre</strong><br>
                        <small class="text-muted" th:text="${sol.usuarioTelegram}">@usuario</small>
                    </td>
                    <td><em th:text="${sol.mensajeOriginal}">"Quiero un plan..."</em></td>
                    <td>
                        <span class="badge bg-info text-dark" th:text="${sol.intencion}">Intención</span><br>
                        <small th:text="${sol.datosExtraidos}">Datos</small>
                    </td>
                    <td>
                        <span th:if="${sol.estado.name() == 'PENDIENTE'}" class="badge bg-warning text-dark">Pendiente</span>
                        <span th:if="${sol.estado.name() == 'CONFIRMADA'}" class="badge bg-success">Confirmada</span>
                        <span th:if="${sol.estado.name() == 'DENEGADA'}" class="badge bg-danger">Denegada</span>
                    </td>
                    <td>
                        <form th:action="@{/admin/solicitudes/cambiar-estado/{id}(id=${sol.id})}" method="post" class="d-inline">
                            <input type="hidden" name="nuevoEstado" value="CONFIRMADA">
                            <button type="submit" class="btn btn-sm btn-success"
                                    th:disabled="${sol.estado.name() == 'CONFIRMADA'}" title="Confirmar Solicitud">✔️ Aceptar</button>
                        </form>

                        <form th:action="@{/admin/solicitudes/cambiar-estado/{id}(id=${sol.id})}" method="post" class="d-inline">
                            <input type="hidden" name="nuevoEstado" value="DENEGADA">
                            <button type="submit" class="btn btn-sm btn-danger"
                                    th:disabled="${sol.estado.name() == 'DENEGADA'}" title="Denegar Solicitud">❌ Rechazar</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
