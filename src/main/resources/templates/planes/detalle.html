<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Detalle del Plan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
    <style>
        .table-diet th { background-color: #f8f9fa; text-align: center; vertical-align: middle; }
        .cell-meal { min-height: 100px; font-size: 0.9rem; }
        .meal-title { font-weight: bold; color: #198754; display: block;}
        .meal-cal { font-size: 0.8rem; color: #6c757d; }

        /* --- ESTILOS DE IMPRESIÓN (PDF) --- */
        @media print {
            /* Ocultar elementos que no queremos en el PDF */
            .navbar, .breadcrumb, .card-footer, .btn, .no-print {
                display: none !important;
            }
            /* Ajustes para que la tabla se vea bien en papel */
            body { padding-top: 0; background-color: white; }
            .container { max-width: 100%; margin: 0; padding: 0; }
            .card { border: none; shadow: none; }
            .table-diet th { background-color: #e9ecef !important; -webkit-print-color-adjust: exact; }
            /* Romper página si es necesario */
            .page-break { page-break-before: always; }
        }
    </style>
</head>
<body class="bg-light">

<div th:replace="~{fragments/nav :: nav}"></div>

<div class="container mt-4 mb-5">
    <nav aria-label="breadcrumb" class="no-print">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="/planes">Mis Planes</a></li>
            <li class="breadcrumb-item active" aria-current="page">Detalle</li>
        </ol>
    </nav>

    <div class="card shadow-sm border-0">
        <div class="card-header bg-white border-bottom py-3 d-flex justify-content-between align-items-center flex-wrap gap-2">
            <div>
                <h3 class="mb-0 text-primary">📅 Tu Menú Semanal</h3>
                <small class="text-muted" th:text="${#temporals.format(plan.fechaInicio, 'dd MMMM')} + ' - ' + ${#temporals.format(plan.fechaFin, 'dd MMMM')}">Fechas</small>
            </div>

            <div class="d-flex align-items-center gap-3">
                <span class="badge bg-success fs-6 rounded-pill">
                    <span th:text="${plan.caloriasTotales}"></span> kcal/día (aprox)
                </span>
                <span class="badge bg-info text-dark fs-6 rounded-pill" th:text="${plan.objetivo}">OBJETIVO</span>
            </div>
        </div>

        <div class="card-body p-0 table-responsive">
            <table class="table table-bordered table-diet mb-0 align-middle">
                <thead>
                <tr>
                    <th style="width: 10%;">Día</th>
                    <th style="width: 30%;">Desayuno ☕</th>
                    <th style="width: 30%;">Comida 🍽️</th>
                    <th style="width: 30%;">Cena 🌙</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="dia : ${dias}">
                    <td class="fw-bold text-center bg-light text-uppercase" th:text="${dia}">LUNES</td>

                    <td th:each="tipo : ${comidas}">

                        <div th:each="pp : ${plan.platosAsignados}"
                             th:if="${pp.diaSemana == dia && pp.tipoComida == tipo}"
                             class="cell-meal shadow-sm border">

                            <div class="d-flex justify-content-between align-items-start">
                                <span class="meal-title" th:text="${pp.nombrePlato}">Nombre del Plato</span>

                                <a th:href="@{/favoritos/toggle/{id}(id=${pp.platoId})}"
                                   class="text-decoration-none no-print fs-5 link-danger"
                                   th:title="${idsFavoritos.contains(pp.platoId)} ? 'Quitar de favoritos' : 'Añadir a favoritos'">
                                    <span th:text="${idsFavoritos.contains(pp.platoId)} ? '❤️' : '🤍'"></span>
                                </a>
                            </div>

                            <div class="mt-2 d-flex justify-content-between align-items-center">
                                <span class="meal-cal">🔥 <span th:text="${pp.calorias}"></span> kcal</span>
                            </div>
                        </div>

                        <div th:unless="${plan.platosAsignados.^[diaSemana == #root.dia && tipoComida == #root.tipo]}"
                             class="text-center text-muted small py-3" style="display:none;">
                            -
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="card-footer bg-white py-3 text-end no-print">
            <a th:href="@{/planes/editar/{id}(id=${plan.idPlan})}" class="btn btn-outline-primary me-2">
                ✏️ Editar Manualmente
            </a>

            <button onclick="window.print()" class="btn btn-outline-secondary me-2">
                🖨️ Imprimir PDF
            </button>

            <a th:href="@{/planes/{id}/lista-compra(id=${plan.idPlan})}" class="btn btn-warning text-dark fw-bold">
                🛒 Ver Lista de Compra
            </a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
